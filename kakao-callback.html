<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>카카오 인가코드</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    background: #f9f9f7;
    color: #0b0b0b;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 24px;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #0d0d0d; color: #ffffff; }
    .card { background: #1a1a19 !important; border-color: rgba(255,255,255,0.10) !important; }
    .code { background: #0d0d0d !important; color: #3987e5 !important; }
    .muted { color: #a3a199 !important; }
  }
  .card {
    max-width: 420px;
    width: 100%;
    background: #ffffff;
    border: 1px solid rgba(11,11,11,0.10);
    border-radius: 14px;
    padding: 28px 24px;
    text-align: center;
  }
  h1 { font-size: 17px; margin: 0 0 12px; }
  .code {
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 14px;
    background: #f9f9f7;
    color: #2a78d6;
    border-radius: 8px;
    padding: 14px;
    word-break: break-all;
    margin: 12px 0;
    user-select: all;
  }
  button {
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    color: #ffffff;
    background: #2a78d6;
    border: none;
    border-radius: 999px;
    padding: 8px 18px;
    cursor: pointer;
  }
  .muted { font-size: 12.5px; color: #52514e; margin-top: 14px; line-height: 1.5; }
  .error { color: #b3221f; }
</style>
</head>
<body>
  <div class="card">
    <h1 id="title">인가코드 확인 중…</h1>
    <div class="code" id="code" hidden></div>
    <button type="button" id="copy-btn" hidden>복사하기</button>
    <div class="muted" id="hint"></div>
  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");
  const error = params.get("error");
  const titleEl = document.getElementById("title");
  const codeEl = document.getElementById("code");
  const copyBtn = document.getElementById("copy-btn");
  const hintEl = document.getElementById("hint");

  if (code) {
    titleEl.textContent = "인가코드가 발급되었습니다";
    codeEl.hidden = false;
    codeEl.textContent = code;
    copyBtn.hidden = false;
    hintEl.textContent = "이 코드를 복사해서 요청하신 분께 전달해주세요. 코드는 곧 만료되니 바로 전달하시는 게 좋아요.";
    copyBtn.addEventListener("click", () => {
      navigator.clipboard.writeText(code).then(() => {
        copyBtn.textContent = "복사됨!";
        setTimeout(() => { copyBtn.textContent = "복사하기"; }, 1500);
      });
    });
  } else if (error) {
    titleEl.textContent = "인증이 취소되었거나 실패했습니다";
    titleEl.classList.add("error");
    hintEl.textContent = "다시 시도해주세요. (오류: " + error + ")";
  } else {
    titleEl.textContent = "인가코드를 찾을 수 없습니다";
    hintEl.textContent = "카카오 로그인 링크를 통해 다시 접속해주세요.";
  }
</script>
</body>
</html>
